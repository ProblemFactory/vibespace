# Release gate mirror (2.336.0): the same battery the pre-push hook enforces
# locally, run on every push/PR so a bypassed or missing local hook still gets
# caught in minutes. Self-hosters see the badge state before pulling an update.
#
# TWO JOBS since the fast/heavy split (2026-09-07): `fast` is the one whose red
# X must arrive quickly — THE TIER RULE in scripts/ci.mjs (B-f4cb, 2026-09-27):
# build + PURE / in-process suites under 10 s + the named LAW pins + the one
# real haiku turn — and `heavy` is everything that boots a scratch server,
# drives a browser, runs a real agent CLI / X server / dtach / the opencode
# binary, or takes 10 s or more. They run in
# PARALLEL — heavy is not a consequence of fast, it is the other half of the
# same battery, and making it `needs: fast` would only delay the slow signal.
# The census (`--census`, also asserted inside `npm run build`) is what
# guarantees the two jobs together cover every scripts/test-*.mjs.
name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  fast:
    runs-on: ubuntu-latest
    # 15 again (B-f4cb): 2.369.192 raised it to 30 when the grown fast tier
    # (184 suites, ~17 min here at 1051 s locally) was cancelled at 15; under
    # THE TIER RULE it measures ~4 min locally (235–249 s), ~6.5 min at the
    # runner's ~1.6× plus ~2 min of apt/npm setup — about half this budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dtach (session persistence layer the boot smoke needs)
        run: sudo apt-get update && sudo apt-get install -y dtach
      - name: Install claude CLI (chat E2E; subscription oat auth is the
          officially documented CI channel — docs/en/github-actions)
        run: npm i -g @anthropic-ai/claude-code
      - run: npm ci
      - run: node scripts/ci.mjs
        env:
          # claude setup-token secret; absent on fork PRs → chat E2E SKIPs
          VIBESPACE_CI_OAT: ${{ secrets.VIBESPACE_CI_OAT }}
  heavy:
    runs-on: ubuntu-latest
    # 60 (B-f4cb): the 23 suites THE TIER RULE moved out of fast add ~750 s of
    # serial work here (~6 min over the runner's two lanes, ~10 min at its
    # ~1.6×) to a job that measured 32–34 min (.189–.191) against 45.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dtach (session persistence layer the boot smokes need)
        run: sudo apt-get update && sudo apt-get install -y dtach
      # CJK fonts (lane-mirror-197, 2.369.198): the runner image ships DejaVu +
      # Liberation and NO CJK family, so every zh / ja glyph the chrome suites
      # measure was DejaVu's fallback box — narrower than the glyph a Chinese or
      # Japanese user sees. The zh / ja "drawn whole" censuses were blind here
      # (a box that fits under tofu can be cut under Noto Sans CJK, what users
      # and this project's own machine render), and a control whose premise was
      # "the pre-fix rule cuts this ja line at 360 px" went red for the font
      # alone. Users have CJK fonts; the runner gets the same family. The
      # controls stay font-independent regardless (test-channel-threads-ui ⑥).
      - name: Install CJK fonts (the runner measures zh / ja text as users see it)
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Install claude CLI
        run: npm i -g @anthropic-ai/claude-code
      - run: npm ci
      # Runner images ship Chrome; the chrome suites SKIP with a reason if a
      # future image drops it, so this never becomes a silent pass.
      #
      # --dirty-ok (round 2): here the EXIT CODE is the signal — the runner is
      # thrown away, so the `data/ci-heavy/<sha>` marker nobody will ever read
      # is not what this job is for. Locally that refusal is the point (it
      # stops a developer spending 16 minutes to be told the run could not
      # produce the verdict they were told to produce); in Actions it would
      # only turn "some step touched a tracked file" into a red gate.
      #
      # BECAUSE THE EXIT CODE IS THE SIGNAL, no "no verdict" path may return 0
      # (round 4): 0 green · 1 red · 2 refused · 3 never got the machine lock ·
      # 4 ABORTED. A suite that CRASHES (a V8 heap-limit OOM is SIGABRT, the
      # kernel OOM killer is SIGKILL) is a RED here, not a supersession — that
      # confusion is what once showed this job a green tick for a tier that
      # crashed and then ran nothing.
      - run: node scripts/ci.mjs --heavy --dirty-ok
        env:
          VIBESPACE_CI_OAT: ${{ secrets.VIBESPACE_CI_OAT }}
      # A chrome suite that goes red HERE and green locally (2.369.125's
      # test-gear-menu Esc legs) leaves its screenshots in /tmp/vs-*-shots-*
      # on a runner nobody can log into; ship them as an artifact so the
      # failure can be read instead of guessed at.
      - name: Upload chrome-suite screenshots (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-suite-shots-${{ github.sha }}
          path: /tmp/vs-*-shots-*/
          if-no-files-found: ignore
          retention-days: 7
