name: secret-scan
on:
  push:
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # THE ONE TABLE (B-89da): the same scripts/secret-scan.mjs the pre-push hook runs over what a push
      # publishes (--range) and the fast tier runs over the tree (scripts/ci.mjs) — every tracked text file, one process
      - name: Scan tracked files for secrets
        run: |
          if ! node scripts/secret-scan.mjs --tree; then
            echo "::error::secret-scan found potential secrets — review the output above"
            exit 1
          fi
