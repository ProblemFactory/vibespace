# One VibeSpace instance per user (one Helm release = one user).
#   helm install u-<user> . --set user=<user> --set password=<pw> --set domain=<your-domain>
# All values below are PLACEHOLDERS — supply your own via --set or a private
# values file. Nothing here is environment-specific.
user: ""                       # REQUIRED — the user's short name (drives host + labels)
password: ""                   # REQUIRED — VIBESPACE_PASSWORD

image:
  repository: ghcr.io/problemfactory/vibespace   # the public VibeSpace image
  tag: "3.3.0"
  pullPolicy: IfNotPresent
  imagePullSecret: ""          # set if the registry is private

# Hostname = <user>.<domain> (or override `host` entirely). Supply your own domain.
domain: "vibespace.example.com"
host: ""

ingress:
  className: nginx             # your ingress controller's class (nginx / traefik / …)
  # Behind this ingress every request reaches the pod from ONE proxy hop: set the instance setting
  # `webhook.trustProxyHops` = 1 (Settings → Channels, advanced) so the webhook door's per-address stranger gate
  # and a path's allow-list judge the CALLER's address (X-Forwarded-For, 1 hop from the right), not the ingress's.
  tls: true
  # Option A (preferred): reference a pre-issued WILDCARD cert secret you created
  # once for *.<domain> (a wildcard REQUIRES a DNS-01 issuer) — adding a user then
  # needs no per-host ACME issuance.
  wildcardCertSecret: ""
  # Option B: let cert-manager issue a per-host cert via this issuer (used only
  # when wildcardCertSecret is empty).
  clusterIssuer: ""

storage:
  className: ""                # your RWO StorageClass (e.g. an RBD/CSI class)
  size: 100Gi                  # thin-provisioned per user
  # Point the pod at a PVC you created out-of-band instead of the chart's own
  # (e.g. after migrating home to a different StorageClass). When set, the
  # chart does NOT create its PVC — the named claim must already exist.
  existingClaim: ""

# ephemeral-storage = what the pod writes OUTSIDE the home PVC: the container's
# writable layer (/tmp — the image sets no TMPDIR, so agent-browser profiles,
# downloads and build scratch land there; apt installs replayed by
# ~/.vibespace-init.sh) plus the container's log. When a node's disk fills, the
# kubelet evicts pods in this order: usage OVER the pod's request first (no
# request = 0, so a pod using 200 KiB is already over it), then the lowest
# priority, then the most over its request. Without a request every instance
# goes before a pod that has one, however much that pod holds.
#   request 2Gi:  above what an instance writes there (a measured fleet:
#                 median 0, p90 8 MiB, all but one ≤ 59 MiB); the scheduler
#                 reserves it per node. One ALREADY over it (that fleet had one
#                 at 8.3 GiB) still ranks with the pods over theirs — give its
#                 release a larger request; the priority class orders that group.
#   limit   20Gi: 2.4× that largest one, so none is evicted by its own limit;
#                 an instance that writes more is evicted ALONE (its sessions
#                 restart; the home PVC is untouched) instead of filling the
#                 node for everyone. `=null` on either key drops it.
resources:
  requests: { cpu: "1", memory: "4Gi", ephemeral-storage: "2Gi" }
  limits:   { cpu: "8", memory: "32Gi", ephemeral-storage: "20Gi" }

# Scheduling AND eviction priority. An interactive workspace that gets
# preempted mid-session loses the user's terminal state, so a shared cluster
# running batch/CI beside VibeSpace should give these pods a priority class
# ABOVE those workloads — ideally one with preemptionPolicy: Never (it can
# outrank others for a slot without evicting anything itself). The kubelet's
# full-disk order (above) ranks pods over their ephemeral-storage request by
# priority, so the same class keeps an instance behind that work there too.
# Empty = the cluster's global default (usually priority 0, the first thing
# anything else preempts or evicts). deploy/README.md has a class to create once.
priorityClassName: ""

# Schedule onto whatever nodes you want VibeSpace pods on.
nodeSelector: {}
tolerations: []

# Clerk SSO (optional): setting publishableKey puts the instance behind Clerk
# sign-in (password auth still works alongside if set). allowedEmails is a
# comma list — "@example.com" entries allow a whole domain; EMPTY rejects
# everyone (each per-user instance must name its owner). The Clerk session
# token must carry an email claim — in the Clerk dashboard add
#   {"email": "{{user.primary_email_address}}"}
# to Sessions → Customize session token (or a JWT template named "vibespace").
clerk:
  publishableKey: ""
  allowedEmails: ""

# Personal S3 space auto-import (optional): when ALL of endpoint/bucket/
# accessKey are set, the instance imports them ONCE on first boot as a normal
# mount named "My storage" (VIBESPACE_S3_* env → Mounts UI; needs fuse.enabled
# for the actual mount). Provision per-user credentials on your object store
# and pass them here.
s3:
  endpoint: ""
  bucket: ""
  prefix: ""
  accessKey: ""
  secretKey: ""

# All-flash CephFS "My storage" (native kernel mount, per-user quota enforced
# on the CephFS subdir). REPLACES the S3 "My storage" when both are set.
# Requires the same securityContext as fuse / appSystem (SYS_ADMIN + AppArmor
# Unconfined) + passwordless sudo (in the image). The scoped cephx key is minted with
# `ceph fs authorize <fs> client.<user> <path> rw`.
cephfs:
  mons: ""       # comma list, e.g. "10.0.0.1,10.0.0.2,10.0.0.3"
  fsName: cephfs
  path: ""       # the per-user subtree, e.g. "/vibespace/<user>"
  user: ""       # scoped cephx client name (without the "client." prefix)
  secret: ""     # the cephx key (base64, from `ceph auth get-key client.<user>`)

# The app system — App persistence Layer 1 (VibeSpace ≥ 2.369.210 inside the
# pod; docs/design-app-persistence.zh.md §3.2). enabled: true sets
# VIBESPACE_APP_SYSTEM=1, so the server installs its sudo helper
# (/usr/local/libexec/vibespace/vs-sysroot-enter) + a sudoers drop-in after
# listen, and Desktop apps → Your installed apps offers "Set up…": a Debian
# userland on the home PVC (~/.vibespace/sysroot) that apps install into and
# that survives pod rebuilds. It FORCES the same securityContext as fuse /
# cephfs (capabilities.add SYS_ADMIN + AppArmor Unconfined — the helper uses
# unshare, bind mounts and chroot); seccomp stays unset. Needs an image with
# sudo + debootstrap (and, for an offline Set up, the baked
# /usr/share/vibespace/sysroot-minbase.tar.gz) — deploy/docker/Dockerfile.
# false (default) = no env, no extra capability: the pod is exactly as before.
# Turning it off later greys the rows; the userland stays on the PVC.
appSystem:
  enabled: false

# /dev/fuse for in-container rclone mounts (Storage/Mounts UI). Requires a
# fuse device plugin on the cluster exposing the resource named below
# (a DaemonSet like fuse-device-plugin advertising github.com/fuse).
fuse:
  enabled: false
  resource: "github.com/fuse"

# Fleet telemetry (optional). forwardUrl/forwardToken make THIS instance ship
# its anonymous diagnostics batches (error names/stacks/metrics — never
# content) to a central collector; ingestToken turns THIS instance INTO the
# collector (enables POST /api/telemetry/ingest + the Fleet section in its
# ⚙ → Diagnostics report). Point forwardUrl at
#   https://<collector-host>/api/telemetry/ingest
# and use ONE shared token as both the collector's ingestToken and every
# sender's forwardToken. The same target also receives every agent FEEDBACK
# report filed on THIS instance (`vibespace-feedback` — the words an agent
# wrote about VibeSpace, with its conversation / Task Group names) and this
# instance pulls the collector's «handled in» marks back every 6 h; the
# collector's ingestToken opens its two feedback doors too.
telemetry:
  forwardUrl: ""
  forwardToken: ""
  ingestToken: ""

# The MAINTAINERS' KEY (optional; lane fleet-feedback-marks). Its sha256 — 64
# lowercase hex, NEVER the key itself (a render with anything else fails) —
# lets the maintainers' triage job list this instance's open agent feedback and
# mark a report handled, naming the release that shipped the fix: on the pod's
# shell, `vibespace-feedback list --open` / `vibespace-feedback handled <id>
# --version <2.369.NNN> [--note "…"]` with the key in env
# VIBESPACE_MAINTAINER_KEY. Nothing else opens with it (any other verb is
# refused `maintainer_key_scope`). The cluster admin provisions it; the value
# stays with the maintainers. Injected as VIBESPACE_MAINTAINER_KEY_SHA; empty =
# no maintainer key.
maintainerKeySha: ""

# DEPRECATED (one release) — the fleet's sign-in relay page is `presets.relayUrl`
# now (below), or better the cluster Secret's `fleet` key (deploy/README.md):
# a company fact rides the presets, which every running pod follows within a
# minute. This old key is still rendered exactly as presets.relayUrl (the
# override's fleet.json; presets.relayUrl wins when both are set) and the
# install / upgrade NOTES say to move it. It is no longer an env: an env
# changes only at a pod restart (lane oauth-relay-one-source).
oauthRelayUrl: ""

# frp relay for PUBLIC URLs (B-0b60). Set addr+token to inject the relay as the
# plugin's default (⚙ → Plugins → Public URLs) — the plugin then default-enables
# and connects on boot. Users can override any of it in the UI. subdomainHost
# (optional) turns publishes into https://<random>.<host> (needs wildcard DNS).
frp:
  addr: ""            # relay host, e.g. relay.example.com or an IP
  port: 7000
  token: ""           # shared secret (stored in the release Secret) — the relay's KNOCK during its grace only
  clusterToken: ""    # the fleet's ONE per-cluster relay token (tools/frps-login-plugin `relay-admin new-token` + `add-cluster`):
                      # each pod logs in to the relay as its own name with it (VIBESPACE_RELAY_CLUSTER_TOKEN; the release Secret)
  subdomainHost: ""   # e.g. preview.example.com → https://<random>.preview.example.com

# Agent-container egress lockdown (needs a NetworkPolicy-enforcing CNI). OFF by
# default — enable once you've set the allow-lists for YOUR network.
networkPolicy:
  enabled: false
  # CIDRs the agent may reach on your internal network (e.g. object storage).
  # Everything else internal (node net, management/BMC, k8s API) is blocked;
  # public internet (minus RFC1918) is allowed for the agent's own API calls.
  allowedInternalCidrs: []     # e.g. ["10.x.y.z/32"]

# Direct CephFS subtree sharing (optional). When url+token are set, "Share a
# folder" on a CephFS My-storage row mints a path-scoped cephx key via the
# in-cluster ceph-mint service so the receiver kernel-mounts the subtree
# directly (bypassing the WebDAV proxy). Absent it, sharing uses the bridge.
cephMint:
  url: ""      # e.g. http://ceph-mint.vibespace.svc:8900
  token: ""    # shared bearer, matches ceph-mint's CEPHMINT_TOKEN


# Optional Prometheus metrics exporter on a SEPARATE (non-ingress) port,
# scraped in-cluster via the standard prometheus.io/* pod annotations.
metrics:
  enabled: true
  port: 3457

# Optional persistent ops log: server logs written to a shared (typically
# CephFS path-scoped) directory that survives pod recreation, for fleet-admin
# scanning. secretName points at a Secret with keys: mons/fsName/client/key/path
# (e.g. minted per-instance by a ceph-mint service). Empty secretName with a
# user set defaults to "u-<user>-opslog".
opslog:
  enabled: false
  secretName: ""
  dir: /var/opslog
  keepDays: 30

# COMPANY PRESETS (Google OAuth clients for Drive / Gmail, a Lark app, browser
# keys) — the instance-default credentials a user would otherwise obtain
# themselves. A user's own key always wins; the UI shows which one is in use.
#
# The VOLUME form (default, VibeSpace ≥ 2.369.200 inside the pod): every
# user's pod mounts ONE cluster-wide Secret (`clusterSecret`, created once by
# the admin in this namespace, keys `gdriveClients` + `integrations`) at
# `mountPath`, with this release's own override layered over it PER KEY. The
# server re-reads the directory when the kubelet updates it (≤ ~2 min after a
# Secret edit) — adding or rotating a company client needs NO helm upgrade and
# NO restart, and a new user's release inherits them with no block of its own.
# Both sources are optional: a missing cluster Secret leaves the instance with
# "no company presets — ask your admin", never a pod that cannot start.
# volume: false = the legacy env form (VIBESPACE_GDRIVE_CLIENTS /
# VIBESPACE_INTEGRATIONS from this release's Secret, read at boot — every
# change is a pod roll); keep it only for a pod whose app predates the volume.
presets:
  volume: true
  clusterSecret: vibespace-cluster-presets
  mountPath: /etc/vibespace/presets
  # THIS release's override (optional), layered over the cluster Secret per
  # key: an entry whose key the cluster also names replaces it, the rest of
  # the cluster's stay. Rendered into the Secret `<release>-preset-override`
  # (keys gdriveClients / integrations, `data:`-rendered so a key dropped here
  # leaves it on upgrade) — changing it is a helm upgrade that touches only
  # that Secret, so the pod does not roll and the server picks it up live.
  # Empty = fall back to the legacy blocks below (`gdrive`, `integrations`).
  override:
    gdriveClients: []    # [{key, label, clientId, clientSecret}, …]
    integrations: []     # [{id, key?, label?, values: {…}}, …]
  # THE FLEET'S SIGN-IN RELAY PAGE (lane oauth-relay-one-source; was
  # `oauthRelayUrl` → env VIBESPACE_OAUTH_RELAY_URL): a pod's Lark / Gmail /
  # Slack sign-in under a company app names this ONE address as its redirect —
  # every pod, every kind — and the page sends the browser back to the pod it
  # started from (/api/channels/oauth/cb/<kind>). Each vendor app registers it
  # ONCE, never one address per pod. The fleet's admin serves the page at
  #   https://admin.<domain>/relay/
  # (vibespace-admin ≥ 2.11.0; its data-allow = the fleet's domain). For the
  # whole fleet put it in the CLUSTER Secret instead (key `fleet`, JSON
  # {"relayUrl": "…"} — deploy/README.md): one patch, every pod. Set here it is
  # THIS release's own, rendered into the override Secret as `fleet`
  # (override/fleet.json, wins over the cluster's) — changing it touches only
  # that Secret: no pod roll, the server re-reads it live. Empty = the
  # cluster's, else none (each pod's sign-in comes back to its own https
  # address, which each vendor app must then list per pod). The volume form
  # only: with volume=false no relay page reaches the pod (the NOTES say so).
  relayUrl: ""

# THE FLEET'S CUSTOM BROWSER KERNEL (lane engine-plugin; docs/design-custom-browser-plugin.zh.md
# §1.4): enabled ⇒ rendered into this release's override fleet.json as ONE key
# `browserEngine` {plugin: "vibespace.custom-browser", default, source, kernel}
# beside the relay page (no env: a fleet fact moves live, never at a restart).
# `default: true` makes the kernel the engine of every NEW agent browser on the
# pod (Settings → Agent browser → «Default browser engine» says «set by the
# cluster preset»; a value the user picks there wins; existing profiles keep
# theirs). `source` = where each pod installs the plugin from (a git URL; its
# credential is the `plugin-git` row of integrations — e.g. presets.override /
# integrations: [{id: plugin-git, values: {host, token}}]), `ref` = the FULL
# commit sha it pins (a tag can move: only a sha is the trust anchor — the
# cluster's plugin is pre-trusted only at that sha, D2; the kernel side's
# v0.1.2 is 7085e75f53efa707fb26c7b297d6789d6c9df0b0). `kernel` = its binary
# (url + sha256 on the fleet's own artifact host; empty = the plugin's
# kernel.json). `preinstall: true` downloads the kernel (≈1.2 GB, onto the
# PVC) right after the pod starts; false = at its first use. The image never
# carries the kernel. The volume form only (presets.volume), like the relay page.
customBrowser:
  enabled: false
  default: false
  preinstall: false
  source:
    git: ""
    ref: ""
  kernel:
    url: ""
    sha256: ""

# LEGACY per-release preset blocks — with presets.volume (the default) they are
# this release's OVERRIDE (the same as presets.override, which wins when set);
# with presets.volume=false they are rendered as env, as before.
# Instance-default Google OAuth clients (Drive mounts / Gmail): a company
# "Internal" consent-screen client lets org users authorize without any
# verification and with long-lived tokens.
gdrive:
  # Preferred: preset list — [{key: org1, label: "My Org (internal)", clientId: "...", clientSecret: "..."}, …]
  clients: []
  # Legacy single default client (used only when clients is empty) — preset key 'default'
  clientId: ""
  clientSecret: ""

# Cluster-provided integration credentials (src/integration-registry.js rows;
# read ONLY by src/server/integration-store.js). Each entry is ONE row id;
# `values` keys are that row's declared field keys. Never stored in the
# instance's data. Suitable: register-once, everyone-may-use credentials (a
# Lark app, a Google OAuth client). NOT suitable: per-seat keys (a CloakBrowser
# license) — one cluster key there means the cluster pays for every user and
# users share the vendor's concurrent-session cap. Gmail has no entry here: it
# REUSES the Google client presets (name the one channels should default to
# `channels` when you provide more than one).
integrations: []
#  - id: lark
#    label: "Lark (cluster app)"
#    values:
#      appId: "cli_xxxxxxxxxxxxxxxx"
#      appSecret: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Optional /dev/net/tun for kernel-mode Tailscale (Plugins, 2.140.0).
# Needs a device plugin serving the tun device (e.g. squat/generic-device-plugin);
# without it plugins fall back to userspace-networking + SOCKS5 automatically.
tun:
  enabled: false
  mode: hostpath      # hostpath (mount /dev/net/tun directly, no cluster plugin) | device-plugin
  resource: ""        # device-plugin mode only: resource name, default squat.ai/tun
